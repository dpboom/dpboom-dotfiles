# Terminal transparency
background_opacity 0.373
confirm_os_window_close 0

# Scrollback and history
scrollback_lines 10000

# Shell integration for prompts and command completion in kitty
shell_integration enabled

# Hide the mouse cursor after 2s idle
mouse_hide_wait 2.0

# Padding around content for a cleaner look
window_padding_width 8 8 8 8

# Smart trailing space stripping when copying
strip_trailing_spaces smart
